services:
  - type: web
    name: gamezone
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:10000
      - key: PORT
        value: "10000"
      - key: GAMEZONE_DATA_DIR
        value: /data
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
