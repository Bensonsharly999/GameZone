databases:
  - name: gamezone-db
    plan: free
    databaseName: gamezone
    user: gamezone

services:
  - type: web
    name: gamezone
    runtime: docker
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gamezone-db
          property: connectionString
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:10000
      - key: GAMEZONE_DATA_DIR
        value: /data
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
