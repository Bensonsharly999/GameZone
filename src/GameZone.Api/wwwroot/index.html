<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GameZone Mobile</title>
  <meta name="theme-color" content="#0b1220" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GameZone" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="app.css?v=23" />
</head>
<body>
  <div class="phone">
    <section id="login-view" class="view login-view">
      <div class="login-glow" aria-hidden="true"></div>
      <div class="login-panel">
        <div class="login-mark" aria-hidden="true">GZ</div>
        <p class="brand">GAMEZONE</p>
        <form id="login-form" class="login-card" autocomplete="on">
          <label for="username">Username</label>
          <input id="username" name="username" autocomplete="username" placeholder="Enter username" />
          <label for="password">Password</label>
          <div class="password-row">
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter password" />
            <span id="toggle-password" class="password-toggle" role="button" tabindex="0" aria-label="Show password">
              <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 5c-5.2 0-9.3 3.4-10.7 8 1.4 4.6 5.5 8 10.7 8s9.3-3.4 10.7-8C21.3 8.4 17.2 5 12 5zm0 13a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/>
              </svg>
              <svg class="eye-off hidden" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3.3 2.3 2 3.6l3.1 3.1C3.3 8 1.9 9.9 1.3 12c1.4 4.6 5.5 8 10.7 8 1.9 0 3.7-.4 5.3-1.2l3.7 3.7 1.3-1.3L3.3 2.3zM12 18c-4.1 0-7.6-2.6-8.8-6 .5-1.5 1.5-2.8 2.8-3.8l1.9 1.9A5 5 0 0 0 12 17c.4 0 .8 0 1.1-.1l1.6 1.6c-.8.3-1.7.5-2.7.5zm8.8-6c-.3.9-.8 1.8-1.4 2.5l-1.5-1.5c.3-.6.5-1.3.5-2 0-2.8-2.2-5-5-5-.7 0-1.4.2-2 .5L10 5.1C10.6 5 11.3 5 12 5c5.2 0 9.3 3.4 10.7 8-.4 1.2-1 2.3-1.9 3.2z"/>
              </svg>
            </span>
          </div>
          <p id="login-error" class="error"></p>
          <button type="submit" id="login-btn">Login</button>
        </form>
      </div>
    </section>

    <section id="shell-view" class="view hidden">
      <header>
        <div>
          <p class="brand">GAMEZONE</p>
          <h2 id="page-title">Dashboard</h2>
        </div>
        <div class="header-actions">
          <p id="user-chip" class="user-name"></p>
          <button id="logout-btn" class="ghost small">Logout</button>
        </div>
      </header>
      <p id="page-error" class="error"></p>
      <main id="content"></main>
      <nav id="main-nav"></nav>
    </section>
  </div>
  <script src="app.js?v=23"></script>
</body>
</html>
